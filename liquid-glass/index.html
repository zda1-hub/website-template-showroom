  <main>
    <div class="intro"><p>Selected visual work · Scroll / drag / explore</p><h1>Liquid<br><em>Index.</em></h1></div>

    <filter id="photo-bubble" x="-35%" y="-15%" width="170%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.075" numOctaves="2" seed="8" result="warp" />
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
